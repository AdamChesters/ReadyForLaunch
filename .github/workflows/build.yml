name: Windows preview build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 90
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -BuildDirectory build -OutputDirectory dist
      - uses: actions/upload-artifact@v4
        with:
          name: ReadyForLaunch-win-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
